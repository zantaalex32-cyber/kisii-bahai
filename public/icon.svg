<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#portalGrad)" />

  <!-- Geometric Emblem / Star & Community Nexus -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer ring of harmony -->
    <circle r="148" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25" stroke-dasharray="12 12" />
    <circle r="128" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.6" />
    
    <!-- Central community pillar & dome -->
    <path d="M-60,70 L60,70 L48,-20 L0,-78 L-48,-20 Z" fill="#ffffff" />
    
    <!-- Archway representing portal access -->
    <path d="M-28,70 L28,70 L28,14 C28,-2 16,-16 0,-16 C-16,-16 -28,-2 -28,14 Z" fill="url(#portalGrad)" />
    
    <!-- Guiding star at the apex -->
    <circle cx="0" cy="-110" r="18" fill="url(#accentGrad)" />
    <polygon points="0,-132 5,-116 22,-110 5,-104 0,-88 -5,-104 -22,-110 -5,-116" fill="#fef3c7" />

    <!-- Three cluster locality nodes (community connection) -->
    <circle cx="-100" cy="18" r="14" fill="url(#accentGrad)" />
    <line x1="-86" y1="18" x2="-48" y2="18" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
    
    <circle cx="100" cy="18" r="14" fill="url(#accentGrad)" />
    <line x1="86" y1="18" x2="48" y2="18" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />

    <circle cx="0" cy="116" r="12" fill="#ffffff" />
    <line x1="0" y1="70" x2="0" y2="104" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>
